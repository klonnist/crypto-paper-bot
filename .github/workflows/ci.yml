name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      # CI canlı OKX'e bağlanmaz: borsa yavaşladığında ya da rate-limit verdiğinde
      # sahte kırmızı üretirdi. Ağ gerektiren testler `network` marker'ı ile
      # işaretlenir (bkz. pytest.ini) ve burada deselect edilir.
      - name: Run tests
        run: pytest -q -m "not network"
