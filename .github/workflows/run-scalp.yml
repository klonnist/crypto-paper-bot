name: run-scalp

# 15 dakikalık scalp katmanının periyodik turu (config.yaml > layers.scalp).
# `run.yml`e DOKUNULMAZ: iki katman ayrı workflow, ayrı tetikleme, ayrı defter, ayrı rapor
# dosyasıdır — ama AYNI çekirdeği koşar (main.py --layer scalp).
#
# Zamanlama: bar 15m, yani barlar :00/:15/:30/:45'te KAPANIR. Tur DIŞ BİR ZAMANLAYICIDAN
# gelir: her saatin :01, :16, :31 ve :46'sında GitHub API üzerinden bir workflow_dispatch
# çağrısı yapılır. Bir dakikalık kayma bilinçlidir — core/data.py kapanmamış barı atar
# (kural 12) ve tam :00'da tetiklenen bir koşu o barı bir tur geç görürdü.
#
# NEDEN dış zamanlayıcı, GitHub cron'u değil. GitHub'ın zamanlanmış tetiklemeleri garantili
# değildir ve kadans sıklaştıkça düşme oranı artar: bu depoda 15 dakikalık cron ölçüldü —
# 14 saatte 57 slottan yalnızca 5'i tetiklendi (~%9), yani tablo modelin değil CRON'un
# kadansını ölçüyordu. Saatlik cron güvenilir tetikleniyordu ama bir sinyalin deftere
# yazılmasını bir saate kadar geciktiriyordu. Dış zamanlayıcının workflow_dispatch çağrısı
# ikisini birden çözer: tetikleme kaçmaz ve kadans barın kendi kadansına döner.
#
# `schedule:` bloğu bu yüzden KALDIRILDI; ikisini birlikte tutmak aynı barı iki koşunun
# işlemesi (concurrency grubunda sırada bekleyen ikinci bir tur) demekti.
# `workflow_dispatch` tek giriştir ve elle tetiklemeye de açık kalır.
#
# Tetikleme yine de kaçarsa (zamanlayıcı düşer, API çağrısı hata alır) SİNYAL KAYBI
# olmaz, çünkü `layers.scalp.signals_per_bar` açıktır: motor son işlenmiş bardan
# `as_of`'a kadarki HER barı sırayla işler ve her barın kendi sinyalini üretir
# (core/engine.py > _trade_step). Tur, atlanan barların her birinde ayrı ayrı koşulmuş
# gibi sonuçlanır — emirler kendi barlarının ertesinde dolar (kural 13) ve pozisyon
# limitleri her barda yeniden sorulur.
#
# Gecikmenin bedeli yalnızca ZAMANLAMADIR: bir sinyal, üretildiği bardan sonra deftere
# geç yazılabilir. Fiyatlar barın kendi fiyatlarıdır, yani ölçüm değişmez.
on:
  workflow_dispatch:

# Defter koşular arası taşınan DURUMDUR: iki tur aynı anda koşarsa ikisi de aynı
# `last_processed_bar`dan başlar ve biri diğerinin commit'ini ezer. Grup 4 saatlik
# koşununkinden AYRIDIR (`paper-trading-run`): iki katman farklı defterlere yazdığı için
# birbirini beklemelerine gerek yok, aynı gruba koymak 15 dakikalık turların 4 saatlik
# koşuyu (ya da tersini) sırada bekletmesi demekti.
concurrency:
  group: paper-trading-run-scalp
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scalp round
        run: python main.py --layer scalp --log-level INFO

      - name: Commit scalp ledgers and metrics
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # YALNIZCA scalp katmanının çıktıları: 4 saatlik katmanın defterine bu iş
          # hiçbir koşulda dokunmaz.
          git add ledgers_scalp docs/data/metrics_scalp.json

          if git diff --cached --quiet; then
            echo "değişiklik yok, commit atlanıyor"
            exit 0
          fi

          AS_OF="$(python -c "import json,pathlib; print(json.loads(pathlib.Path('docs/data/metrics_scalp.json').read_text())['as_of'])")"
          git commit -m "scalp: ${AS_OF}"

          # 15 dakikada bir koşan bir iş, 4 saatlik koşunun commit'iyle sık sık yarışır.
          # Defter append-only olduğu için rebase güvenlidir; birkaç kez denenir.
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız oldu"
          exit 1

      # Anlık sinyal bildirimi (scripts/telegram_signals.py). `run.yml`in GÜNLÜK ÖZETİNDEN
      # ayrıdır ve ona dokunmaz: bu, scalp katmanının YENİ SİNYAL olayını bildirir.
      #
      # Defter commit'inden SONRA gelir, günlük özetle aynı gerekçeyle: bildirim ölçümün
      # parçası değildir, burada ne olursa olsun tur çoktan kaydedilmiştir. `if: always()`
      # push çakışmasının bildirimi susturmaması, `continue-on-error` ve script'in
      # koşulsuz 0 dönmesi ise iki ayrı emniyet kemeridir.
      #
      # Hangi sinyalin bildirileceğine (son bar, susturma penceresi, toplu mesaj) script
      # karar verir: kapıyı cron'a taşımak, gecikmiş ya da elle tetiklenmiş bir koşuda
      # mesajı ya iki kez ya hiç yollardı.
      - name: Telegram scalp signal alerts
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_signals.py --log-level INFO

      # Susturma penceresinin durumu (state/telegram_scalp.json) koşular arası TAŞINMAK
      # zorundadır: runner her koşuda sıfırdan kurulur, commit edilmezse "bu sinyali 4 bar
      # önce bildirmiştim" bilgisi her turda kaybolurdu.
      #
      # Neden ayrı bir commit: dosyayı yukarıdaki defter commit'ine katmak, bildirim
      # adımını commit'ten ÖNCE koşmayı gerektirirdi — yani ağ erişimi olan bir adımı turun
      # kaydedilmesinin önüne koymayı. Ayrı ve `continue-on-error` bir adım, en kötü
      # ihtimalde tekrar eden bir mesaja mal olur; ölçüme hiç dokunmaz. Defter ve rapor
      # dosyaları bu adımda KAPSAM DIŞIDIR (`git add` yalnızca durum dosyasını alır).
      - name: Commit notification state
        if: always()
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Dosya yoksa bildirim hiç yollanmamıştır (sinyal yok, secret yok, hata).
          # `git add` bu durumda hata verirdi; `set -e` ile adım kırmızıya dönerdi.
          if [ ! -f state/telegram_scalp.json ]; then
            echo "bildirim durumu dosyası yok, commit atlanıyor"
            exit 0
          fi

          git add state/telegram_scalp.json

          if git diff --cached --quiet; then
            echo "bildirim durumu değişmedi, commit atlanıyor"
            exit 0
          fi

          git commit -m "scalp-telegram: bildirim durumu"

          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "push başarısız (deneme ${attempt}), rebase edilip tekrar denenecek"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            sleep $((2 ** attempt))
          done
          echo "push 4 denemede başarısız oldu"
          exit 1
